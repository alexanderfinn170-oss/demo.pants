<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Jens Pant – Style & Comfort</title>

<style>
body {
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f6f9;
color:#222;
line-height:1.6;
display:flex;
justify-content:center;
}

.wrapper {
width:100%;
max-width:1000px;
background:white;
padding-bottom:50px;
}

/* Header */
.header {
background:#1b262c;
color:white;
text-align:center;
padding:50px 20px;
}
.header img.logo {
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
background:#ccc;
}
.header h2 {color:#bbe1fa;margin:0;}
.header h1 {margin:10px 0 0;font-size:34px;}
.header p {color:#bbe1fa;font-size:18px;}

/* Attractive Image Frame */
.product-section img,
.slider img,
.main-product-img{
width:100%;
border-radius:15px;
border:4px solid #ffffff;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
transition:0.4s;
background:#ddd;
}
.product-section img:hover,
.slider img:hover{
transform:scale(1.03);
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

/* Slider */
.slider {position:relative;height:380px;overflow:hidden;border-radius:15px;margin:20px;}
.slide {position:absolute;width:100%;height:100%;opacity:0;transition:1s;}
.active {opacity:1;}

/* Section */
.section {padding:20px;}
.price-box {
background:#e3f2fd;
border-radius:12px;
text-align:center;
padding:20px;
}
.old-price {text-decoration:line-through;color:gray;}
.new-price {font-size:26px;font-weight:bold;color:#1b262c;}

.btn, button {
display:block;
width:90%;
max-width:400px;
margin:20px auto;
padding:18px;
background:#1b262c;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}
.btn:hover, button:hover {
background:#3282b8;
transform:scale(1.05);
}

/* Order */
.order-box {
background:#e0f7fa;
padding:20px;
border-radius:12px;
margin:20px;
}
input, select {
width:100%;
padding:14px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}
label span {color:red;}

.quantity-box {
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin:15px 0;
}
.quantity-box button {
width:40px;
height:40px;
font-size:22px;
padding:0;
}
.total-price {
text-align:center;
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.success-message {
display:none;
background:#d4edda;
padding:10px;
border-radius:6px;
margin-top:10px;
color:#155724;
}

/* Mobile Fix */
@media(max-width:768px){
.wrapper {width:100%;}
}
</style>
</head>
<body>

<div class="wrapper">

<div class="header">
<img class="logo" src="#" alt="Logo">
<h2>Your Company</h2>
<h1>Premium Jens Pant</h1>
<p>Style, Comfort & Durability</p>
</div>

<div class="slider">
<div class="slide active"><img src="#" alt=""></div>
<div class="slide"><img src="#" alt=""></div>
<div class="slide"><img src="#" alt=""></div>
</div>

<div class="section price-box">
<p class="old-price">আগের মূল্য: ৳ ১২০০</p>
<p class="new-price">অফার মূল্য: ৳ ৯৯০</p>
<a href="#order" class="btn">এখনই অর্ডার করুন</a>
</div>

<div class="section product-section">
<img src="#" alt="">
</div>

<div class="order-box" id="order">

<h2 style="text-align:center;">অর্ডার ফর্ম</h2>

<!-- Main Product Small Image -->
<img src="#" class="main-product-img" style="max-width:200px;margin:0 auto 15px;display:block;">

<form id="orderForm">

<label>আপনার নাম <span>*</span></label>
<input type="text" name="name" required>

<label>মোবাইল নম্বর <span>*</span></label>
<input type="tel" name="phone" required>

<label>ঠিকানা <span>*</span></label>
<input type="text" name="address" required>

<label>সাইজ নির্বাচন করুন</label>
<select name="size">
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="quantity-box">
<button type="button" onclick="changeQty(-1)">-</button>
<span id="qty">1</span>
<button type="button" onclick="changeQty(1)">+</button>
</div>

<div class="total-price">
মোট মূল্য: ৳ <span id="total">990</span>
</div>

<input type="hidden" name="quantity" id="quantityInput" value="1">
<input type="hidden" name="totalPrice" id="totalInput" value="990">

<button type="submit">অর্ডার কনফার্ম করুন</button>

</form>

<div class="success-message" id="successMsg">
ধন্যবাদ! আপনার অর্ডার সফলভাবে সাবমিট হয়েছে।
</div>

</div>

</div>

<script>
let price = 990;
let qty = 1;

function changeQty(change){
qty += change;
if(qty < 1) qty = 1;
document.getElementById("qty").innerText = qty;
document.getElementById("total").innerText = price * qty;
document.getElementById("quantityInput").value = qty;
document.getElementById("totalInput").value = price * qty;
}

// Slider
let slides = document.querySelectorAll(".slide");
let index = 0;
setInterval(()=>{
slides[index].classList.remove("active");
index = (index+1)%slides.length;
slides[index].classList.add("active");
},4000);

// Form Submit
document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("successMsg").style.display="block";
this.reset();
});
</script>

</body>
</html>
