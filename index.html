<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Jens Pant – Limited Offer</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:#f4f6f9;
color:#222;
}

.wrapper{
max-width:1000px;
margin:auto;
background:#fff;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#1b262c,#3282b8);
color:white;
text-align:center;
padding:40px 20px;
position:relative;
}

.discount-badge{
position:absolute;
top:15px;
right:15px;
background:#ff3b3b;
padding:8px 15px;
border-radius:50px;
font-weight:bold;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.hero img{
width:100%;
max-height:350px;
object-fit:cover;
border-radius:15px;
margin-top:20px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.hero h1{margin:15px 0 5px;font-size:30px;}
.hero p{font-size:16px;}

.stock{
color:#ffdd57;
font-weight:bold;
margin-top:10px;
}

/* PRICE */
.price-box{
text-align:center;
padding:25px;
}
.old-price{
text-decoration:line-through;
color:gray;
}
.new-price{
font-size:32px;
color:#e63946;
font-weight:bold;
}

/* TRUST */
.trust{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
padding:20px;
text-align:center;
}
.trust div{
background:#f1f1f1;
padding:10px 15px;
border-radius:8px;
font-size:14px;
}

/* SECTION */
.section{
padding:20px;
}

.section img{
width:100%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
margin-bottom:15px;
transition:.4s;
}
.section img:hover{
transform:scale(1.03);
}

/* ORDER */
.order-box{
background:#e0f7fa;
padding:20px;
border-radius:12px;
margin:20px;
}

input,select{
width:100%;
padding:14px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

label span{color:red;}

.quantity-box{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin:15px 0;
}

.quantity-box button{
width:40px;
height:40px;
font-size:22px;
}

.total{
text-align:center;
font-size:20px;
font-weight:bold;
margin-top:10px;
}

button{
display:block;
width:100%;
padding:16px;
background:#1b262c;
color:white;
border:none;
border-radius:10px;
font-size:18px;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:#3282b8;
}

/* Sticky Button */
.sticky-order{
position:fixed;
bottom:0;
left:0;
right:0;
background:#e63946;
color:white;
text-align:center;
padding:15px;
font-weight:bold;
cursor:pointer;
z-index:1000;
}

/* Floating */
.float-buttons{
position:fixed;
bottom:70px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}
.float-buttons a{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#25d366;
}
.float-buttons a.messenger{
background:#0084ff;
}
.float-buttons img{
width:22px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="hero">
<div class="discount-badge">40% OFF</div>
<h1>Premium Jens Pant</h1>
<p>Limited Time Offer – Cash On Delivery Available</p>
<div class="stock">⚠️ সীমিত স্টক বাকি আছে</div>
<img src="#" alt="Main Product">
</div>

<div class="price-box">
<p class="old-price">আগের মূল্য ৳1200</p>
<p class="new-price">এখন মাত্র ৳990</p>
</div>

<div class="trust">
<div>🚚 3-5 দিন ডেলিভারি</div>
<div>💵 Cash On Delivery</div>
<div>🔄 সহজ রিটার্ন</div>
<div>📞 24/7 সাপোর্ট</div>
</div>

<div class="section">
<img src="#" alt="">
<img src="#" alt="">
<img src="#" alt="">
</div>

<div class="order-box" id="order">

<h2 style="text-align:center;">অর্ডার ফর্ম</h2>

<img src="#" style="max-width:200px;margin:auto;display:block;border-radius:12px;box-shadow:0 10px 20px rgba(0,0,0,.2);">

<form id="orderForm">

<label>নাম <span>*</span></label>
<input type="text" required>

<label>মোবাইল <span>*</span></label>
<input type="tel" required>

<label>ঠিকানা <span>*</span></label>
<input type="text" required>

<label>সাইজ</label>
<select>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="quantity-box">
<button type="button" onclick="changeQty(-1)">-</button>
<span id="qty">1</span>
<button type="button" onclick="changeQty(1)">+</button>
</div>

<div class="total">
মোট: ৳ <span id="total">990</span>
</div>

<button type="submit">অর্ডার কনফার্ম করুন</button>

</form>

</div>

</div>

<div class="sticky-order" onclick="document.getElementById('order').scrollIntoView();">
👉 এখনই অর্ডার করুন
</div>

<div class="float-buttons">
<a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"></a>
<a href="#" class="messenger"><img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Messenger_logo_2020.svg"></a>
</div>

<script>
let price=990;
let qty=1;
function changeQty(change){
qty+=change;
if(qty<1)qty=1;
document.getElementById("qty").innerText=qty;
document.getElementById("total").innerText=price*qty;
}
</script>

</body>
</html>
